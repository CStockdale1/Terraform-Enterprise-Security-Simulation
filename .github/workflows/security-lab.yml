name: Enterprise Security Lab

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: terraform-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.3.2
        with:
          image-tag: latest
          install-awslocal: true
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infrastructure/local
        run: terraform init

      - name: Terraform Apply
        working-directory: infrastructure/local
        run: terraform apply -auto-approve

      - name: Start application services
        working-directory: services
        env:
          POSTGRES_USER: labuser
          POSTGRES_PASSWORD: labpassword
          POSTGRES_DB: companydb
        run: docker compose up -d

      - name: Wait for services
        run: sleep 10

      - name: Run Terraform security tests
        working-directory: tests
        run: bash terraform_security.sh

      - name: Run IAM least-privilege tests
        working-directory: tests
        run: bash iam_least_privilege.sh

      - name: Run logging security tests
        working-directory: tests
        run: bash logging_security.sh

      - name: Run network segmentation tests
        working-directory: tests
        run: bash network_segmentation.sh
